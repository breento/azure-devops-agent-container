name: Build container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  POWERSHELL_VERSION: 7.6.6
  POWERSHELL_SHA256_AMD64: 9585F38AB5A026C3FC0995486E26E12050777960FEF47A22DCA98B577C5D27A7
  POWERSHELL_TARBALL_SHA256_ARM64: 924829e54c983648f6f1419a2dc7f9433c861b2fb5bd57736ff096c24f133729
  TERRAFORM_VERSION: 1.17.1
  PACKER_VERSION: 1.16.2
  AZURE_CLI_VERSION: 2.92.0
  AZP_AGENT_VERSION: 5.279.0
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/azure-devops-agent

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run regression tests and syntax checks
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/start-agent.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and validate both architectures without publishing
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            POWERSHELL_VERSION=${{ env.POWERSHELL_VERSION }}
            POWERSHELL_SHA256_AMD64=${{ env.POWERSHELL_SHA256_AMD64 }}
            POWERSHELL_TARBALL_SHA256_ARM64=${{ env.POWERSHELL_TARBALL_SHA256_ARM64 }}
            TERRAFORM_VERSION=${{ env.TERRAFORM_VERSION }}
            PACKER_VERSION=${{ env.PACKER_VERSION }}
            AZURE_CLI_VERSION=${{ env.AZURE_CLI_VERSION }}
            AZP_AGENT_VERSION=${{ env.AZP_AGENT_VERSION }}

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate short commit tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            POWERSHELL_VERSION=${{ env.POWERSHELL_VERSION }}
            POWERSHELL_SHA256_AMD64=${{ env.POWERSHELL_SHA256_AMD64 }}
            POWERSHELL_TARBALL_SHA256_ARM64=${{ env.POWERSHELL_TARBALL_SHA256_ARM64 }}
            TERRAFORM_VERSION=${{ env.TERRAFORM_VERSION }}
            PACKER_VERSION=${{ env.PACKER_VERSION }}
            AZURE_CLI_VERSION=${{ env.AZURE_CLI_VERSION }}
            AZP_AGENT_VERSION=${{ env.AZP_AGENT_VERSION }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: false
          provenance: false

      - name: Verify published OCI index and report digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST"
          docker buildx imagetools inspect --raw "$IMAGE_NAME@$IMAGE_DIGEST" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] | unique == ["amd64", "arm64"]
          '
          {
            echo "Published multi-architecture image: `$IMAGE_NAME@$IMAGE_DIGEST`"
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
